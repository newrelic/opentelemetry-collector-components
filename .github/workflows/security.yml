name: Security Scan

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/golang@master
      env:
        SNYK_TOKEN: ${{ secrets.CAOS_SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

